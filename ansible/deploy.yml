---
- name: Deploy Spring PetClinic
  hosts: app_servers
  become: false

  vars:
    acr_name: petclinicregistry68.azurecr.io
    image_name: spring-petclinic
    tenant_id: 0bbb7513-9735-4c74-8c79-a851844820ad

  tasks:
    - name: Login to ACR
      shell: |
        az login --service-principal \
          --username {{ lookup('env', 'ACR_APP_ID') }} \
          --password {{ lookup('env', 'ACR_SECRET') }} \
          --tenant {{ tenant_id }}
        az acr login --name petclinicregistry68

    - name: Stop existing container
      shell: docker stop petclinic || true
      ignore_errors: yes

    - name: Remove existing container
      shell: docker rm petclinic || true
      ignore_errors: yes

    - name: Pull latest image from ACR
      shell: docker pull {{ acr_name }}/{{ image_name }}:latest

    - name: Run PetClinic container
      shell: |
        docker run -d \
          --name petclinic \
          --restart always \
          -p 8080:8080 \
          {{ acr_name }}/{{ image_name }}:latest

    - name: Verify container is running
      shell: docker ps | grep petclinic
      register: container_status

    - name: Print container status
      debug:
        msg: "PetClinic container is running: {{ container_status.stdout }}"